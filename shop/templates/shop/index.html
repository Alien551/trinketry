{% extends 'layout.html' %}
{% load shop_tags %}

{% block body %}
    <div class="shop_body">
        {% get_products as products %}
        {% for product in products %}
        <div class="product_card">
            <a href="{{ product.get_absolute_url }}" class="item">
                <div class="product_image">
                    <img src="{{ product.image.url }}" alt="{{product.name}}">
                </div>
            </a>
            <p>{{product.name}}</p>
            <p>{{product.price}}</p>
            <div class="button_wrapper">
                <a href="{% url 'cart:add' product.slug %}" class="btn">Добавить в корзину</a>
            </div>
            {% comment %} <button data-action="add-to-cart" class="btn product-btn">Добавить в корзину</button> {% endcomment %}
        </div>
        {% endfor %}
    </div>
{% endblock %}
