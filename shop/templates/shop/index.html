{% extends 'layout.html' %}
{% load shop_tags %}

{% block body %}
    <div class="shop_body">
        {% get_all_products_list as products_list %}
        {% for product in products_list %}
        <div class="product_card">
            <a href="{{ product.get_absolute_url }}" class="item">
                <div class="product_image">
                    <img src="{{product.image.url}}" alt="{{product.name}}">
                </div>
            </a>
            <p>{{product.name}}</p>
            <p>{{product.cost}}</p>
            <button class="btn product-btn">
                    Добавить в корзину
            </button>
        </div>
        {% endfor %}
    </div>
{% endblock %}
